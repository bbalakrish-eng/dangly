<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Choose a Charm</title>
  <link rel="stylesheet" href="gallery.css" />
</head>
<body>
  <header>
    <h1>Choose your charm</h1>
    <p>Pick one to hang on your screen. New items arrive with updates.</p>
  </header>

  <div id="categories"></div>

  <footer>
    <h2>Or use your own emoji</h2>
    <div class="custom-row">
      <input id="customEmoji" type="text" maxlength="4" placeholder="🍀" />
      <button id="useCustom">Use this emoji</button>
    </div>
  </footer>

  <script src="gallery.js"></script>
</body>
</html>
