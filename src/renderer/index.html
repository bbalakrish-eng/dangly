<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Dangly Overlay</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="effects"></canvas>
  <svg id="charmString" class="charm-string hidden">
    <polyline id="charmStringLine" points="" />
  </svg>
  <div id="charmBeads" class="charm-beads"></div>
  <div id="charmChain" class="charm-chain"></div>
  <div id="charm" class="charm"><div id="charmInner" class="charm-inner">🍀</div></div>
  <div id="pet" class="pet hidden"><span class="pet-glyph">🐈</span></div>
  <div id="rageLayer" class="rage-layer"></div>
  <div id="rageCatcher" class="rage-catcher hidden"></div>
  <div id="rageHint" class="rage-hint hidden"></div>
  <script src="host.js"></script>
  <script src="effect-presets.js"></script>
  <script src="particle-engine.js"></script>
  <script src="pet-presets.js"></script>
  <script src="pet-engine.js"></script>
  <script src="charm-physics.js"></script>
  <script src="audio.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
