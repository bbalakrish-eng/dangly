<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DANGLY</title>
  <meta name="description" content="Lucky charms, rituals and weather from traditions around the world, living on your screen. Try any of them in your browser." />
  <link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="engine/overlay.css" />
  <link rel="stylesheet" href="site.css" />
</head>
<body data-theme="wallpaper">
  <header class="hero">
    <div class="frame">
      <section class="left">
        <!-- LOGO: replace .brand-mark with your logo (an <img> or inline <svg>, ~36px tall).
             The wordmark text beside it can stay or go. -->
        <div class="toprow">
          <a class="brand" href="./">
            <span class="brand-mark" aria-hidden="true"></span>
            <span class="brand-name">DANGLY</span>
          </a>
          <nav class="pillnav" id="pillnav" aria-label="Categories"></nav>
        </div>

        <h1>Lucky charms<br />for your<span class="faces" id="faces" aria-hidden="true"></span><br />desktop.</h1>

        <a class="scroll" href="#all">
          <u></u>
          <span><i class="ic" style="--i: url(icons/arrow-down.svg)"></i>Scroll for everything</span>
          <u></u>
        </a>

        <p class="copy">Hang a charm from the top of your screen. Break a coconut, light a lamp, let it snow.</p>
      </section>

      <section class="right">
        <div class="stage" id="stage">
          <div class="floor"></div>
          <!-- Only shown in the "wallpaper" theme: a Mac menu bar over the wallpaper. -->
          <div class="menubar" aria-hidden="true">
            <div class="mb-left"><b>DANGLY</b><span>File</span><span>Edit</span><span>View</span><span>Window</span><span>Help</span></div>
            <div class="mb-right" id="clock"></div>
          </div>
          <div class="chip" id="chipHint" style="left: 9%; top: 42%"></div>
          <div class="chip" id="chipOrigin" style="right: 8%; top: 54%"></div>

          <!-- The live preview: the same engine the desktop app runs, confined to this stage. -->
          <div class="overlay" id="overlay" aria-hidden="true">
            <canvas id="effects"></canvas>
            <svg id="charmString" class="charm-string hidden">
              <polyline id="charmStringLine" points="" />
            </svg>
            <div id="charmBeads" class="charm-beads"></div>
            <div id="charmChain" class="charm-chain"></div>
            <div id="charm" class="charm hidden"><div id="charmInner" class="charm-inner"></div></div>
            <div id="pet" class="pet hidden"><span class="pet-glyph"></span></div>
          </div>

          <a class="vert" href="#all" aria-label="See everything">
            <span id="vertName"></span>
            <i><b class="ic" style="--i: url(icons/arrow-down.svg)"></b></i>
          </a>
          <div class="tags" id="tags"></div>
        </div>

        <div class="notch n-tr">
          <a class="get" href="#get"><i><b class="ic" style="--i: url(icons/arrow-up-right.svg)"></b></i>Get the app</a>
        </div>

        <div class="notch n-bl" id="tray">
          <div class="cards" id="trayCards"></div>
          <div class="pager">
            <b id="trayCount"></b>
            <span>
              <button type="button" id="prev" aria-label="Previous"><i class="ic" style="--i: url(icons/arrow-left.svg)"></i></button>
              <button type="button" id="next" aria-label="Next"><i class="ic" style="--i: url(icons/arrow-right.svg)"></i></button>
            </span>
          </div>
        </div>
      </section>
    </div>
  </header>

  <main class="all" id="all"></main>

  <footer class="foot" id="get">
    <div>
      <h2>Keep them on your screen.</h2>
      <p>Charms, rituals and weather for your Mac and PC.</p>
    </div>
    <a class="get get-dark" href="#get"><i><b class="ic" style="--i: url(icons/arrow-up-right.svg)"></b></i>Get the app</a>
  </footer>

  <script src="bridge.js"></script>
  <script src="engine/host.js"></script>
  <script src="engine/effect-presets.js"></script>
  <script src="engine/particle-engine.js"></script>
  <script src="engine/pet-presets.js"></script>
  <script src="engine/pet-engine.js"></script>
  <script src="engine/charm-physics.js"></script>
  <script src="engine/renderer.js"></script>
  <script src="site.js"></script>
</body>
</html>
